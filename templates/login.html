<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Portal Login - Sepsis CDSS</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon">
                    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2v20M2 12h20M12 6l4 4-4 4-4-4 4-4z"/>
                    </svg>
                </div>
                <h1>SEPSIS CDSS</h1>
                <p class="brand-subtitle">Clinical Decision Support & Risk Assessment System</p>
            </div>

            <form id="loginForm" class="login-form">
                <div id="loginAlert" class="alert alert-danger hidden" role="alert"></div>

                <div class="form-group">
                    <label for="username">Staff Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="e.g. admin" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="btnTogglePassword" class="btn-toggle-password" title="Toggle password visibility">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnLogin" class="btn btn-primary btn-block btn-lg">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    <span>Sign In to Clinical Portal</span>
                </button>
            </form>

            <div class="demo-credentials-badge" id="btnFillDemoCredentials">
                <div>🔑 Demo Credentials (Click to Auto-fill):</div>
                <strong>Username: admin | Password: Password@123</strong>
            </div>

            <div class="login-footer" style="margin-top: 20px; text-align: center; font-size: 12px; color: var(--text-muted);">
                <div class="security-badge" style="display: inline-flex; align-items: center; gap: 6px;">
                    <span class="dot online"></span>
                    <span>PhysioNet Sepsis ML Engine Active</span>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
